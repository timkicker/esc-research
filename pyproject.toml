[project]
name = "esc-research"
version = "0.1.0"
description = "Eurovision Song Contest: how much of a vote is the song, how much is the relationship"
requires-python = "==3.12.*"
dependencies = [
    "pandas>=2.2",
    "duckdb>=1.0",
    "pyarrow>=16.0",
    "requests>=2.32",
    "requests-cache>=1.2",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "statsmodels>=0.14",
    "linearmodels>=6.0",
    "scikit-learn>=1.5",
    "tqdm>=4.66",
    "xlrd>=2.0",
    "pytrends>=4.9",
]

[project.scripts]
esc = "esc.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/esc"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
