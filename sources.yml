# every external source, nothing lands in data/raw without a row here
#
# url          string for api and manual sources, filename -> url mapping for
#              downloads so the keys line up with sha256
# retrieved_at written by fetch.record_provenance
# sha256       filename -> digest, written by the same helper, null means not
#              fetched yet and not "no checksum needed"
#
# download urls are pinned to a release tag or a commit sha, a url pointing at
# a moving branch is not provenance

sources:
  - id: eurovision_dataset
    name: Eurovision Song Contest Dataset (Spijkervet)
    url:
      contestants.csv: https://github.com/Spijkervet/eurovision-dataset/releases/download/2023/contestants.csv
      votes.csv: https://github.com/Spijkervet/eurovision-dataset/releases/download/2023/votes.csv
    kind: download
    license: unspecified
    citation: >-
      Spijkervet, J. (2020). The Eurovision Song Contest Dataset (Version 1.0)
      [Data set]. Zenodo. https://doi.org/10.5281/zenodo.4036457
    retrieved_at: '2026-10-01T09:46:13Z'
    sha256:
      contestants.csv: 3b8cc72b81a63ea63788b711248b5f23544b6e3778d8a3a4e976309c69adedf7
      votes.csv: f699205c62756c51e14bc94166705fa2ea3c78cc27c940503e87e21ed532d8a8
    notes: >-
      release tag 2023. contestants.csv has 1734 rows 1956-2023 with place_final,
      running_final, the jury and televote split per entry and the lyrics.
      votes.csv has 51354 rows 1957-2023, jury and televote filled from 2016.
      the two files disagree about country names: contestants spells them out,
      votes uses lowercase iso2. the repo has no LICENSE file, the authors ask
      to be cited. upstream is dead since november 2023, hence eurovisionworld

  - id: eurovisionworld
    name: eurovisionworld.com results, 2024 onwards
    url: https://eurovisionworld.com/eurovision/{year}
    kind: api
    license: >-
      no stated reuse licence. robots.txt disallows only /bonus/ and /cdn-cgi/,
      the results pages are allowed
    citation: eurovisionworld.com, results pages per contest year
    retrieved_at: '2026-10-01T10:08:06Z'
    sha256:
      2024-jury.html: fcda095efa475b0e8ec5fafd28624d329ca72475a40ce767eac4f31045f29c53
      2024-tele.html: 95917767987fffb3cca3e27edd78f7b3c47833307678f2dc5258f29502692670
      2025-jury.html: 8a18491c765493e774ae13f862a404fd0a17f535b6d07bfc24f49603c6c96a39
      2025-tele.html: 874d9760f6a97e89da468ced3950cc5b5b55d78195e135409ad1aa41fbb33505
      2026-jury.html: 3c830cb684a7ba57fb336e62066e761b1f0b1635b4db4483c8bde37bcd9a4ad5
      2026-tele.html: de50b6078beb8c9b15cd7cf17c176520408217604a270d8c7ec91830f5d84432
    notes: >-
      fills the gap the spijkervet release leaves after 2023. the scoreboard is
      built by javascript and the jury/televote switch hangs on a data-button,
      so this needs a real browser and not requests. throttle, keep the rendered
      html on disk, never fetch twice

  - id: cepii_geodist
    name: CEPII GeoDist, dyadic file
    url:
      dist_cepii.zip: https://www.cepii.fr/distance/dist_cepii.zip
    kind: download
    license: Etalab Open Licence 2.0
    citation: >-
      Mayer, T., & Zignago, S. (2011). Notes on CEPII's distances measures: The
      GeoDist database. CEPII Working Paper 2011-25.
      https://www.cepii.fr/pdf_pub/wp/2011/wp2011-25.pdf
    retrieved_at: '2026-10-01T09:46:16Z'
    sha256:
      dist_cepii.zip: 1854825bab1abe7197f6e47295a7ced5f72c83bc95076768f733c4969ed86780
    notes: >-
      the zip holds a single dist_cepii.xls from 2004, no stata file, so pandas
      needs xlrd. 50176 rows on iso3 codes, dummies come as 0/1 ints and have to
      become nullable booleans. no year dimension, states created after the last
      revision are simply missing

  - id: wikidata
    name: Wikidata Query Service
    url: https://query.wikidata.org/sparql
    kind: api
    license: CC0 1.0
    citation: Wikidata contributors. Wikidata. Wikimedia Foundation.
    retrieved_at: null
    sha256: null
    notes: >-
      performer birth date P569 and sex P21. a plain name match is not enough,
      "Sergey Lazarev" alone returns six different people, so the query has to
      constrain to eurovision participants. bands have neither property, that is
      roughly a third of all entries

  - id: google_trends
    name: Google Trends via pytrends
    url: https://trends.google.com/
    kind: api
    license: >-
      no public reuse licence, unofficial endpoint through pytrends. aggregated
      data, no individual users
    citation: Google Trends, search interest by region and over time
    retrieved_at: null
    sha256: null
    notes: >-
      interest_by_region normalises per country over the queried terms to sum
      100, so it is a share and not a level. five terms per query, so batches
      carry a fixed anchor term and get rescaled against it. a zero means below
      one percent of the anchor and not no interest. the series is sampled, two
      identical calls differ, so the raw responses go to disk or the pipeline is
      not reproducible. cut the window the day before the final, the contest day
      itself is leakage

  - id: team_dataset
    name: teammate repo, lyrics analysis
    url:
      lyrics_analysis.json: https://raw.githubusercontent.com/ezvezdov/eurovision-dataset/6a53ab9b52922c06d0cab6cd3fbe9592286810be/processed/lyrics_analysis.json
    kind: download
    license: GPL-3.0, we read one data file and take no code
    citation: Zviazdou, Y. (2026). eurovision-dataset. https://github.com/ezvezdov/eurovision-dataset
    retrieved_at: '2026-10-04T06:40:21Z'
    sha256:
      lyrics_analysis.json: d40ed35f0828aab5f2f9b5e7810e783f2caefbdc6802f15483b2eb122ff5645e
    notes: >-
      437 finalists 2008-2026, llm labels from the lyrics: sentiment, theme, two
      repetition flags, and the main language. pinned to the commit, the repo
      still moves. its trends file is not used yet, 96.7% of the scores are zero

  - id: manual_country_map
    name: country name and code bridge
    url: data/manual/country_map.csv
    kind: manual
    license: CC0 1.0
    citation: this project
    retrieved_at: null
    sha256: null
    notes: >-
      bridges three vocabularies: spelled out names from contestants.csv,
      lowercase iso2 from votes.csv, and iso3 for cepii. nothing joins on names

  - id: manual_voting_regimes
    name: voting regime per contest year
    url: data/manual/voting_regimes.csv
    kind: manual
    license: CC0 1.0
    citation: this project
    retrieved_at: null
    sha256: null
    notes: which vote types exist in a given year, per the table in README.md

  - id: manual_contest_dates
    name: date of each final
    url: data/manual/contest_dates.csv
    kind: manual
    license: CC0 1.0
    citation: this project, from the wikipedia page per contest year
    retrieved_at: null
    sha256: null
    notes: >-
      needed to place the google trends window, which ends the day before the
      final

  - id: manual_recent_entries
    name: entries after the upstream datasets end
    url: data/manual/recent_entries.csv
    kind: manual
    license: CC0 1.0
    citation: this project
    retrieved_at: null
    sha256: null
    notes: >-
      the entry side of 2024 onwards. the vote side of those years comes from
      eurovisionworld, by hand it would be a thousand rows per year

# considered and rejected, listed so nobody adds them later thinking nobody looked
excluded:
  - id: spotify
    name: Spotify Web API
    reason: terms of use prohibit machine learning applications
  - id: tmdb
    name: TMDB API
    reason: terms of use prohibit machine learning applications
  - id: youtube_view_counts
    name: YouTube Data API view counts
    reason: >-
      only returns today's count, so an old entry carries every view it got
      because it won. that is the leak the published work admits to
  - id: audio_features
    name: audio feature extraction
    reason: >-
      published work gets 1-8% of the variance out of them and spotify shut its
      audio api in 2024. the song effect comes from the receiver effect instead
  - id: eurostat_migration
    name: Eurostat migr_pop1ctz
    reason: dropped with the team on 2026-09-20, dimension codes never confirmed
  - id: wikimedia_pageviews
    name: Wikimedia REST pageviews
    reason: >-
      dropped with the team on 2026-09-17 in favour of google trends, which is
      available per country and therefore at the pair level
